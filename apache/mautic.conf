# Mautic's own .htaccess files hold its rules. These cover the directories that
# are links to the files directory, where those .htaccess files aren't.

# Uploaded files and language packs are only read through Mautic.
<LocationMatch "^/(media/files|translations)(/|$)">
    Require all denied
</LocationMatch>

# Uploaded images are served as files, never run.
<LocationMatch "^/media/images/.*\.(php|phtml|phar)$">
    Require all denied
</LocationMatch>

# Mautic is installed by mautic-update, never from the web.
<LocationMatch "^/(index\.php/)?installer(/|$)">
    Require all denied
</LocationMatch>
